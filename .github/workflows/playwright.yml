
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: "Run live Amazon tests (may encounter CAPTCHA)"
        required: true
        type: boolean
        default: false

jobs:
  validate:
    name: TypeScript validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

  live-tests:
    name: Live Amazon tests (optional)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: true
        run: npm test

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: amazon-playwright-artifacts
          path: |
            playwright-report/
            reports/
            screenshots/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
